<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7cc8e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おさかなルーム">
<meta name="format-detection" content="telephone=no">
<title>おさかなルーム</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 上の帯：なんにちめ・じかん・コイン -->
  <header id="hud">
    <button id="btn-back" class="pill back" hidden aria-label="へやに もどる"><span class="ic">◀</span><span class="lb">へや</span></button>
    <div id="hud-time" class="pill time"><span id="hud-phase-ic" class="ic">☀️</span><span id="hud-day">1にちめ</span><span id="hud-phase">あさ</span></div>
    <div class="spacer"></div>
    <button id="btn-menu" class="pill menu-btn" hidden><span class="ic">☰</span><span class="lb">メニュー</span></button>
    <button id="hud-hearts" class="pill hearts" aria-label="ハート"><span class="heart-ic" aria-hidden="true"></span><span class="hh-body"><span id="hud-heart-n">0</span><span id="hud-heart-day">きょう 0／20</span></span></button>
    <div id="hud-coins" class="pill coins"><span class="coin-ic" aria-hidden="true"></span><span id="hud-coin-n">100</span></div>
  </header>

  <!-- へや -->
  <section id="scr-room" class="screen" data-screen="room">
    <div id="room-stage">
      <img id="room-bg" src="assets/room/room_base.jpg" alt="" draggable="false">
      <div id="room-night"></div>
      <div id="room-slots"></div>
      <div id="room-tank-tip" class="tip-bubble">タップ してね</div>
    </div>
    <nav id="room-nav" class="dock">
      <button class="nav-btn" data-go="shop"><span class="nav-ic">🛒</span><span class="lb">おみせ</span></button>
      <button class="nav-btn" data-go="dex"><span class="nav-ic">📖</span><span class="lb">ずかん</span></button>
      <button class="nav-btn" data-go="missions"><span class="nav-ic">⭐</span><span class="lb">ミッション</span><span class="badge" hidden></span></button>
    </nav>
  </section>

  <!-- すいそう -->
  <section id="scr-tank" class="screen" data-screen="tank" hidden>
    <canvas id="aq"></canvas>
    <canvas id="aq-salt" hidden></canvas>
    <div id="tank-cap" hidden></div>
    <button id="feeder-sw" hidden aria-label="じどう えさやり"><img src="assets/items/auto_feeder.png" alt=""><span class="fs-lb">じどう えさ</span><span class="fs-state">オン</span></button>
    <div id="thermo" hidden><span class="th-title">🌡️ おんど</span><div class="th-steps"></div></div>
    <div id="tank-title"><button class="tt-prev" aria-label="まえの すいそう">◀</button><div class="tt-body"><span class="tt-name"></span><span class="tt-water"></span><span class="tt-dots"></span></div><button class="tt-next" aria-label="つぎの すいそう">▶</button></div>
    <div id="tank-pops"></div>
    <div id="gauges" class="panel">
      <div class="gauge" data-g="temp"><div class="g-top"><span class="g-ic">🌡️</span><span class="g-lb">すいおん</span><span class="g-val"></span></div><div class="g-st"><span class="g-face"></span><span class="g-word"></span></div><div class="bar temp"><div class="band"></div><i hidden></i><div class="mark"></div></div></div>
      <div class="gauge" data-g="clean"><div class="g-top"><span class="g-ic">💧</span><span class="g-lb">きれいさ</span></div><div class="g-st"><span class="g-face"></span><span class="g-word"></span></div><div class="bar"><i></i></div></div>
      <div class="gauge" data-g="air"><div class="g-top"><span class="g-ic">🫧</span><span class="g-lb">くうき</span></div><div class="g-st"><span class="g-face"></span><span class="g-word"></span></div><div class="bar"><i></i></div></div>
      <div class="gauge" data-g="food"><div class="g-top"><span class="g-ic">🍙</span><span class="g-lb">おなか</span></div><div class="g-st"><span class="g-face"></span><span class="g-word"></span></div><div class="bar"><i></i></div></div>
    </div>
    <div id="care" class="dock">
      <button class="care-btn" data-care="feed"><img src="assets/items/food_flake.png" alt=""><span class="lb">えさ</span></button>
      <button class="care-btn vit" data-care="vitamin" hidden><img src="assets/items/food_vitamin.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'care-emoji',textContent:'💊'}))"><span class="lb">ビタミン<small class="vit-sub">げんきの もと</small><small class="vit-left"></small></span></button>
      <button class="care-btn" data-care="water"><img src="assets/items/water_change.png" alt=""><span class="lb">みずかえ</span></button>
      <button class="care-btn" data-care="clean"><span class="care-emoji">🥅</span><span class="lb">そうじ</span></button>
      <button class="care-btn" data-care="photo"><span class="care-emoji">📷</span><span class="lb">しゃしん</span></button>
    </div>
    <div id="hint" class="hint" hidden></div>
    <button id="hint-mini" aria-label="ヒント" hidden>💡</button>
    <div id="fish-card" class="card" hidden></div>
    <div id="tank-empty" class="center-msg" hidden></div>
  </section>

  <!-- しゃしん（水槽だけ） -->
  <div id="photo-frame" hidden><div class="sparkles"></div><div class="photo-stamp"></div></div>
  <button id="photo-exit" class="pill" hidden>もどる</button>

  <!-- おみせ・ずかん・ミッション（全画面のシート） -->
  <section id="scr-shop" class="screen sheet" data-screen="shop" hidden>
    <div class="sheet-head"><h2>おみせ</h2>
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="fish">🐟 さかな</button>
        <button class="tab" data-tab="equip">🪨 きぐ</button>
        <button class="tab" data-tab="food">🍙 えさ</button>
        <button class="tab tab-tanks" data-tab="tanks" hidden>🫙 すいそう</button>
      </div>
    </div>
    <div id="shop-tank"><span class="st-lb">いれる すいそう：</span><button class="st-prev" aria-label="まえの すいそう">◀</button><span class="st-name"></span><button class="st-next" aria-label="つぎの すいそう">▶</button></div>
    <div id="shop-guide-slot"></div>
    <div id="shop-list" class="grid"></div>
  </section>

  <section id="scr-dex" class="screen sheet" data-screen="dex" hidden>
    <div class="sheet-head"><h2>ずかん</h2><div id="dex-rate" class="rate"></div></div>
    <div id="dex-list" class="grid"></div>
  </section>

  <section id="scr-missions" class="screen sheet" data-screen="missions" hidden>
    <div class="sheet-head"><h2>ミッション</h2></div>
    <div id="mission-list" class="list"></div>
  </section>

  <!-- チュートリアルの ふきだし -->
  <div id="guide" hidden><div class="guide-face">🐟</div><div class="guide-text"></div><button class="guide-ok pill" hidden>OK</button></div>
  <div id="guide-arrow" hidden>👇</div>

  <!-- おんがく（js/bgm.js が あるときだけ 出す） -->
  <button id="btn-bgm" hidden aria-label="おんがく"><span class="bgm-ic" aria-hidden="true"></span><span class="lb">おんがく</span></button>
  <div id="bgm-picker" class="modal" hidden><div class="bgm-panel">
    <div class="bgm-head"><span class="bgm-h">おんがくを えらぶ</span><span class="bgm-state"></span><span class="spacer"></span><button class="btn bgm-stop">■ とめる</button><button class="bgm-close" aria-label="とじる">✕</button></div>
    <div class="bgm-list"></div>
  </div></div>

  <!-- かいほうの おいわい -->
  <div id="celebrate" hidden><div class="confetti"></div><div class="cel-box"><div class="cel-ic">🌊</div><div class="cel-text"></div><div class="cel-sub"></div><div class="cel-btns"><button class="btn soft cel-ok">やったー！</button><button class="btn primary cel-shop">🛒 おみせへ</button></div></div></div>

  <!-- ダイアログ・おしらせ -->
  <div id="dialog" class="modal" hidden><div class="modal-box"><div class="modal-body"></div><div class="modal-btns"></div></div></div>
  <div id="toasts"></div>
  <div id="update-bar" hidden><span>あたらしい ばんが あるよ</span><button class="pill" id="update-go">あたらしく する</button></div>

  <!-- デバッグ（?debug=1） -->
  <div id="debug" hidden></div>
</div>

<!-- たて持ち -->
<div id="rotate"><div class="rotate-box"><div class="rotate-ic">📱</div><div>よこに してね</div></div></div>

<noscript><p style="padding:20px;font-size:20px">このゲームは JavaScript を つかうよ</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
